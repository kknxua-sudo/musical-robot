<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Lumin Music</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Segoe UI,sans-serif;background:#fff;color:#111}body{padding-bottom:104px}.shell{display:flex;min-height:100vh}.sidebar{width:236px;flex:0 0 236px;border-right:1px solid #e9e9ed;padding:28px 16px;position:fixed;top:0;bottom:0;background:rgba(255,255,255,.97)}.logo{font-weight:800;font-size:25px;letter-spacing:-.04em;padding:0 10px 26px;display:flex;align-items:center;gap:10px}.logo-mark{width:34px;height:34px;border-radius:10px;background:#fa2d55;color:#fff;display:grid;place-items:center;font-size:18px}.nav{display:grid;gap:4px}.nav button,.playlists button{width:100%;border:0;background:transparent;text-align:left;color:#666;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover,.playlists button:hover{background:#f1f1f3;color:#111}.label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.12em;font-weight:800;padding:24px 12px 8px}.playlists{display:grid;gap:3px}.main{margin-left:236px;width:calc(100% - 236px)}.topbar{height:72px;position:sticky;top:0;z-index:8;background:rgba(255,255,255,.86);backdrop-filter:blur(22px);border-bottom:1px solid #efeff2;display:flex;align-items:center;padding:0 34px;gap:18px}.search{width:350px;max-width:42vw;background:#f1f1f3;border:0;border-radius:10px;padding:11px 14px;outline:none;font-size:14px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.top-actions button{border:0;background:transparent;color:#666;font-weight:600;cursor:pointer}.page{padding:34px 42px 42px;max-width:1450px;margin:auto}.hero{position:relative;min-height:410px;border-radius:26px;overflow:hidden;background:linear-gradient(120deg,#f7b5c5 0%,#d8b6ff 42%,#9cc3ff 100%);display:flex;align-items:flex-end}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 28%,rgba(255,255,255,.6),transparent 24%),linear-gradient(90deg,rgba(15,15,20,.64),rgba(15,15,20,.1) 72%,rgba(15,15,20,0));}.hero-copy{position:relative;z-index:2;color:#fff;padding:42px;max-width:620px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.78}.hero h1{font-size:64px;line-height:.95;letter-spacing:-.065em;margin:10px 0 12px}.hero p{margin:0 0 22px;color:rgba(255,255,255,.82);font-size:16px}.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}.btn.white{background:#fff;color:#111}.btn.dark{background:#111;color:#fff}.section{margin-top:38px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section h2{font-size:27px;letter-spacing:-.035em;margin:0}.see{font-size:13px;color:#666;font-weight:600}.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}.card{min-width:0;cursor:pointer}.cover{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;color:rgba(255,255,255,.72);font-size:44px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.08);transition:transform .16s ease}.card:hover .cover{transform:translateY(-3px)}.card strong,.card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card strong{font-size:14px;margin-top:9px}.card span{font-size:12px;color:#7b7b83;margin-top:3px}.rows{border-top:1px solid #ececf0}.row{display:grid;grid-template-columns:48px minmax(220px,1.5fr) minmax(150px,1fr) 90px 40px;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid #ececf0;min-height:64px}.row:hover{background:#f5f5f7;border-radius:9px}.thumb{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.75);font-weight:800}.rmain strong,.rmain span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rmain strong{font-size:13px}.rmain span,.album,.duration{font-size:12px;color:#85858d}.more{border:0;background:transparent;color:#888;font-size:18px;cursor:pointer}.player{position:fixed;left:250px;right:14px;bottom:12px;z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);border:1px solid #dcdce2;border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.12);min-height:82px;padding:10px 14px;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:center;gap:14px}.now{display:flex;align-items:center;gap:10px;min-width:0}.mini{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 auto}.now-copy{min-width:0}.now-copy strong,.now-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now-copy strong{font-size:13px}.now-copy span{font-size:11px;color:#888}.controls{display:flex;align-items:center;justify-content:center;gap:6px}.control{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#56565d}.control:hover{background:#f0f0f2}.control.play{background:#111;color:#fff;width:40px;height:40px}.progress{grid-column:2;display:flex;align-items:center;gap:8px;margin-top:-8px}.progress input{flex:1}.time{font-size:9px;color:#8d8d95}.volume{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:#666}.range{accent-color:#fa2d55}@media(max-width:1180px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}.player{left:250px;grid-template-columns:1fr 1.4fr}.volume{display:none}}@media(max-width:800px){.sidebar{display:none}.main{margin-left:0;width:100%}.topbar{padding:0 18px}.page{padding:24px 18px}.hero{min-height:360px}.hero h1{font-size:48px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.player{left:8px;right:8px;bottom:8px;grid-template-columns:1fr 1fr}.progress{grid-column:1 / -1;grid-row:2}.now{grid-column:1}.controls{grid-column:2}.duration{display:none}}</style></head><body><div class="shell"><aside class="sidebar"><div class="logo"><span class="logo-mark">L</span>Lumin</div><div class="nav"><button class="active">⌂ Home</button><button onclick="document.getElementById('search').focus()">⌕ Search</button><button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">◫ Library</button></div><div class="label">Playlists</div><div class="playlists"><button>♡ Favorites</button><button>♫ Chill Mix</button><button>◉ New Releases</button><button>◷ Recently Added</button></div></aside><main class="main"><header class="topbar"><input id="search" class="search" placeholder="Search artists, songs, albums…"><div class="top-actions"><button onclick="alert('Sign in coming in the server build')">Sign In</button><button class="btn dark">Try Lumin</button></div></header><div class="page"><section class="hero"><div class="hero-copy"><div class="eyebrow">LUMIN SESSIONS</div><h1>Night Drive</h1><p>Late-night electronic essentials for the city after dark.</p><button class="btn white" onclick="choose(0)">▶ Play</button></div></section><section class="section"><div class="section-head"><h2>Recently Played</h2><span class="see">See All</span></div><div class="shelf" id="shelf"></div></section><section class="section" id="library"><div class="section-head"><h2>Made for You</h2><span class="see">See All</span></div><div class="shelf" id="shelf2"></div></section><section class="section"><div class="section-head"><h2>Library</h2><span class="see">Your music</span></div><div class="rows" id="rows"></div></section></div></main></div><div class="player"><div class="now"><div class="mini" id="mini">V</div><div class="now-copy"><strong id="track">Velvet Horizon</strong><span id="artist">Lumin Sessions</span></div></div><div class="controls"><button class="control" onclick="prev()">⏮</button><button class="control play" id="play">▶</button><button class="control" onclick="next()">⏭</button></div><div class="volume">◒ <input class="range" type="range" min="0" max="1" step=".01" value=".8"></div><div class="progress"><span class="time" id="cur">0:00</span><input class="range" type="range" min="0" max="100" value="0" id="bar"><span class="time">3:36</span></div></div><script>const tracks=[['Velvet Horizon','Lumin Sessions','Night Drive','#32145f'],['Glass Gardens','The North Arcade','Bloom','#0b6470'],['Afterglow','Maya Vale','Late Hours','#7a174e'],['Parallel Lines','House Meridian','City Lights','#28357e'],['Open Window','Cedar & Gold','Homecoming','#874b08'],['Soft Focus','Ari Bloom','Soft Focus','#23613b'],['Satellite','Polar Youth','Signal','#253987'],['Midnight Bloom','Dusk Avenue','The Quiet Club','#7f1231']];let idx=0,playing=false;function cover(t){return '<div class="cover" style="background:'+t[3]+'">'+t[0][0]+'</div>'}function thumb(t){return '<div class="thumb" style="background:'+t[3]+'">'+t[0][0]+'</div>'}const shelf=document.getElementById('shelf'),shelf2=document.getElementById('shelf2'),rows=document.getElementById('rows');tracks.slice(0,6).forEach((t,i)=>shelf.insertAdjacentHTML('beforeend','<article class="card" onclick="choose('+i+')">'+cover(t)+'<strong>'+t[0]+'</strong><span>'+t[1]+'</span></article>'));tracks.slice(2,8).forEach((t,i)=>shelf2.insertAdjacentHTML('beforeend','<article class="card" onclick="choose('+(i+2)+')">'+cover(t)+'<strong>'+t[0]+'</strong><span>'+t[1]+'</span></article>'));tracks.forEach((t,i)=>rows.insertAdjacentHTML('beforeend','<div class="row"><div>'+thumb(t)+'</div><div class="rmain"><strong>'+t[0]+'</strong><span>'+t[1]+'</span></div><div class="album">'+t[2]+'</div><div class="duration">3:'+(10+i*7)+'</div><button class="more" onclick="choose('+i+')">•••</button></div>'));function choose(i){idx=i;playing=true;sync()}function prev(){idx=(idx+tracks.length-1)%tracks.length;playing=true;sync()}function next(){idx=(idx+1)%tracks.length;playing=true;sync()}function sync(){const t=tracks[idx];document.getElementById('track').textContent=t[0];document.getElementById('artist').textContent=t[1];document.getElementById('mini').textContent=t[0][0];document.getElementById('mini').style.background=t[3];document.getElementById('play').textContent=playing?'❚❚':'▶'}document.getElementById('play').onclick=()=>{playing=!playing;sync()};sync();</script></body></html>
