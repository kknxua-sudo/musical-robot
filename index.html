<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fa">
<title>Lumin Music</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171b;background:#f7f7fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbfbfd,#f4f4f7)}button,input{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.app{min-height:100vh;padding-bottom:105px}.side{position:fixed;inset:0 auto 0 0;width:235px;background:rgba(250,250,252,.96);border-right:1px solid #e8e8ec;padding:24px 15px;display:flex;flex-direction:column;z-index:5}.brand{font-weight:800;font-size:21px;display:flex;gap:9px;align-items:center;padding:0 9px 26px}.orb{width:32px;height:32px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button,.playlist button{display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border-radius:11px;color:#6f6f78;font-weight:650}.nav button.active,.nav button:hover,.playlist button:hover{background:#ececf1;color:#111}.sep{height:1px;background:#e6e6eb;margin:20px 4px 15px}.smallcap{font-size:11px;font-weight:800;color:#9a9aa2;letter-spacing:.1em;text-transform:uppercase;padding:0 10px 8px;display:flex;justify-content:space-between}.playlist{display:grid;gap:2px;overflow:auto}.playlist button{font-size:13px;padding:9px 10px}.bottom{margin-top:auto}.account{border-top:1px solid #e8e8ec;padding-top:14px;display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#dddde4;display:grid;place-items:center;font-weight:800}.account-info{min-width:0;flex:1}.account-info strong,.account-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-info strong{font-size:13px}.account-info span{font-size:11px;color:#96969e}.main{margin-left:235px}.top{height:72px;border-bottom:1px solid #ededf0;background:rgba(250,250,252,.8);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 34px;position:sticky;top:0;z-index:4}.search{width:min(540px,65vw);background:#efeff2;border:1px solid #e3e3e8;border-radius:12px;padding:10px 13px}.search input{width:100%;background:transparent;border:0;outline:0}.account-btn{margin-left:auto;background:#1b1b1f;color:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.page{padding:36px;max-width:1300px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.intro h1{font-size:42px;line-height:1;letter-spacing:-.05em;margin:7px 0 9px}.muted{color:#85858e}.hero{min-height:315px;border-radius:26px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(120deg,#191923,#3e1a4d);display:flex;align-items:end;margin-bottom:42px}.hero .shade{position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(255,255,255,.2),transparent 30%),linear-gradient(90deg,rgba(15,15,20,.92),rgba(15,15,20,.25))}.hero-letter{position:absolute;right:13%;top:2%;font-size:290px;font-weight:900;color:rgba(255,255,255,.15);line-height:1}.hero-copy{position:relative;padding:38px;max-width:620px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:#b4b4bd}.hero h2{font-size:56px;line-height:.95;letter-spacing:-.06em;margin:10px 0}.hero p{color:rgba(255,255,255,.72);margin:0 0 21px}.primary{background:#eb4f88;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800}.secondary{background:#e9e9ee;border-radius:999px;padding:10px 15px;font-weight:750}.actions{display:flex;gap:9px}.section{margin-top:34px}.section h2{font-size:21px;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:17px}.card{min-width:0}.art{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:40px;font-weight:900;box-shadow:0 7px 18px rgba(0,0,0,.08);position:relative}.card strong,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card strong{font-size:13px;margin-top:8px}.card span{font-size:12px;color:#8b8b93}.rows{border-top:1px solid #e5e5ea}.row{display:grid;grid-template-columns:48px minmax(200px,1.6fr) 1fr 75px 44px;align-items:center;gap:10px;padding:7px;border-bottom:1px solid #e7e7eb;min-height:64px}.row:hover{background:#ececf0;border-radius:10px}.thumb{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.58);font-weight:800}.row .title{min-width:0}.row .title strong,.row .title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .title strong{font-size:13px}.row .title span,.sub{font-size:12px;color:#888891}.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.icon:hover{background:#e2e2e7}.empty{padding:42px;border:1px dashed #d6d6de;border-radius:16px;text-align:center;color:#92929b}.player-wrap{position:fixed;left:0;right:0;bottom:0;padding:9px 13px 13px;z-index:10}.player{max-width:1180px;margin:auto;background:rgba(251,251,253,.94);border:1px solid #dedee4;border-radius:18px;box-shadow:0 18px 45px rgba(25,20,35,.15);display:grid;grid-template-columns:1fr 1.2fr .75fr;align-items:center;gap:14px;padding:9px 12px}.now{display:flex;gap:10px;align-items:center;min-width:0}.nowcopy{min-width:0}.nowcopy strong,.nowcopy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nowcopy strong{font-size:12px}.nowcopy span{font-size:11px;color:#898991}.controls{display:grid;gap:3px}.transport{display:flex;justify-content:center;align-items:center;gap:2px}.play{width:35px;height:35px;border-radius:50%;background:#19191d;color:#fff;display:grid;place-items:center}.progress{display:flex;gap:7px;align-items:center}.progress span{font-size:9px;color:#92929a;min-width:28px;text-align:center}.progress input{width:100%}.vol{display:flex;justify-content:flex-end;align-items:center;gap:7px}.auth{position:fixed;inset:0;background:rgba(17,17,20,.35);backdrop-filter:blur(9px);z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(405px,100%);background:#fff;border-radius:23px;padding:30px;box-shadow:0 25px 75px rgba(0,0,0,.25);position:relative}.modal h2{margin:4px 0}.modal form{display:grid;gap:10px;margin-top:18px}.modal input{padding:11px 12px;border:1px solid #dddde3;border-radius:10px;background:#fafafc;outline:0}.close{position:absolute;right:11px;top:11px}.toast{position:fixed;right:18px;top:87px;background:#1d1d20;color:#fff;padding:10px 13px;border-radius:999px;font-size:12px;z-index:30}.mobile{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:820px){.side{width:78px}.side .brand span:last-child,.nav button span,.playlist,.smallcap,.account-info,.account .icon{display:none}.nav button{justify-content:center}.main{margin-left:78px}.top{padding:0 18px}.page{padding:25px 18px}.cards{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:48px 1fr 55px 36px}.row .album{display:none}.player{grid-template-columns:1fr 1.5fr}.vol{display:none}.hero h2{font-size:43px}.hero-copy{padding:28px}}@media(max-width:560px){.top{height:64px}.page{padding:20px 14px}.intro h1{font-size:35px}.hero{min-height:265px}.hero h2{font-size:38px}.hero-letter{font-size:210px}.row{grid-template-columns:46px 1fr 34px}.row .sub{display:none}.player{grid-template-columns:1fr}.controls{order:2}.now{order:1}.player .vol{display:none}.mobile{display:block}.top .search{width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const demo=[
{id:'d1',title:'Velvet Horizon',artist:'Lumin Sessions',album:'Night Drive',genre:'Electronic',c:'#2d145c'},
{id:'d2',title:'Glass Gardens',artist:'The North Arcade',album:'Bloom',genre:'Indie',c:'#0c5b64'},
{id:'d3',title:'Afterglow',artist:'Maya Vale',album:'Late Hours',genre:'R&B',c:'#7a174e'},
{id:'d4',title:'Parallel Lines',artist:'House Meridian',album:'City Lights',genre:'House',c:'#28357e'},
{id:'d5',title:'Open Window',artist:'Cedar & Gold',album:'Homecoming',genre:'Acoustic',c:'#874b08'},
{id:'d6',title:'Soft Focus',artist:'Ari Bloom',album:'Soft Focus',genre:'Chill',c:'#23613b'},
{id:'d7',title:'Satellite',artist:'Polar Youth',album:'Signal',genre:'Alternative',c:'#253987'},
{id:'d8',title:'Midnight Bloom',artist:'Dusk Avenue',album:'The Quiet Club',genre:'Pop',c:'#7f1231'}];
const state={tab:'home',query:'',current:null,playing:false,user:JSON.parse(localStorage.getItem('lumin_user')||'null'),playlists:JSON.parse(localStorage.getItem('lumin_playlists')||'[]'),uploads:[],timer:null,ctx:null,pos:0,duration:180,volume:.8};
const $=s=>document.querySelector(s); const save=()=>{localStorage.setItem('lumin_user',JSON.stringify(state.user));localStorage.setItem('lumin_playlists',JSON.stringify(state.playlists))};
function trackList(){return [...state.uploads,...demo]}
function fmt(s){s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function art(t){return `<div class="art" style="background:${t.c}">${t.title[0]}</div>`}
function thumb(t){return `<div class="thumb" style="background:${t.c}">${t.title[0]}</div>`}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function render(){const all=trackList();const filtered=all.filter(t=>`${t.title} ${t.artist} ${t.album} ${t.genre}`.toLowerCase().includes(state.query.toLowerCase()));
let playlists=state.playlists.map((p,i)=>`<button data-playlist="${p.id}">♫ <span>${p.name}</span></button>`).join('');
const nav=`<aside class="side"><div class="brand"><span class="orb">L</span><span>Lumin</span></div><div class="nav"><button class="${state.tab==='home'?'active':''}" data-tab="home">⌂ <span>Home</span></button><button class="${state.tab==='search'?'active':''}" data-tab="search">⌕ <span>Search</span></button><button class="${state.tab==='library'?'active':''}" data-tab="library">▤ <span>Library</span></button></div><div class="sep"></div><div class="smallcap">Playlists <button class="icon" id="newpl">＋</button></div><div class="playlist">${playlists||'<span class="muted" style="padding:8px 10px;font-size:11px">Create one with ＋</span>'}</div><div class="bottom">${state.user?`<div class="account"><div class="avatar">${state.user.name[0].toUpperCase()}</div><div class="account-info"><strong>${state.user.name}</strong><span>${state.user.email}</span></div><button class="icon" id="logout">↪</button></div>`:`<button class="secondary" id="login" style="width:100%">Sign in</button>`}</div></aside>`;
const top=`<header class="top"><input id="search" class="search" value="${state.query.replaceAll('"','&quot;')}" placeholder="Search artists, songs, albums…">${!state.user?'<button class="account-btn" id="loginTop">Account</button>':''}</header>`;
let content='';
if(state.tab==='home'){const lead=all[0];content=`<div class="intro"><div><div class="eyebrow">YOUR MUSIC</div><h1>Listen, beautifully.</h1><div class="muted">A calm, ad-free space for the music you own.</div></div><div class="actions"><button class="secondary" id="uploadBtn">Upload</button></div></div><section class="hero"><div class="shade"></div><div class="hero-letter">${lead.title[0]}</div><div class="hero-copy"><div class="eyebrow">FEATURED</div><h2>${lead.title}</h2><p>${lead.artist} · ${lead.album}</p><button class="primary" data-play="${lead.id}">${state.current?.id===lead.id&&state.playing?'Pause':'Play now'}</button></div></section><section class="section"><h2>Made for you</h2><div class="cards">${all.slice(0,6).map(t=>`<div class="card">${art(t)}<strong>${t.title}</strong><span>${t.artist}</span></div>`).join('')}</div></section>`}
if(state.tab==='search'){content=`<div class="intro"><div><div class="eyebrow">SEARCH</div><h1>${state.query?`Results for “${state.query}”`:'Find something to play'}</h1></div></div>${filtered.length?`<div class="rows">${filtered.map(row).join('')}</div>`:'<div class="empty">No matches yet. Try another artist, album, or song.</div>'}`}
if(state.tab==='library'){content=`<div class="intro"><div><div class="eyebrow">LIBRARY</div><h1>Your collection</h1><div class="muted">${state.uploads.length} uploaded tracks · ${state.playlists.length} playlists</div></div><div class="actions"><button class="primary" id="uploadBtn">Upload music</button><input id="file" type="file" accept="audio/*" hidden></div></div><section class="section"><h2>Uploaded music</h2>${state.uploads.length?`<div class="rows">${state.uploads.map(row).join('')}</div>`:'<div class="empty">Upload an MP3, WAV, M4A, OGG, or other audio file to start your library.</div>'}</section>`}
if(state.tab.startsWith('playlist:')){const p=state.playlists.find(x=>x.id===state.tab.split(':')[1]);const ts=(p?.tracks||[]).map(id=>all.find(t=>t.id===id)).filter(Boolean);content=p?`<div class="intro"><div><div class="eyebrow">PLAYLIST</div><h1>${p.name}</h1><div class="muted">${ts.length} songs</div></div></div>${ts.length?`<div class="rows">${ts.map(t=>row(t,true)).join('')}</div>`:'<div class="empty">Add songs from Search using the playlist menu.</div>`:'<div class="empty">Playlist not found.</div>'}
function row(t,inPlaylist=false){return `<div class="row"><div>${thumb(t)}</div><div class="title"><strong>${t.title}</strong><span>${t.artist}</span></div><div class="album sub">${t.album}</div><div class="sub">${fmt(t.duration||180)}</div><div>${inPlaylist?`<button class="icon" data-remove="${t.id}">×</button>`:`<button class="icon" data-play="${t.id}">▶</button>`}</div></div>`}
const player=state.current?`<div class="player"><div class="now">${thumb(state.current)}<div class="nowcopy"><strong>${state.current.title}</strong><span>${state.current.artist}</span></div></div><div class="controls"><div class="transport"><button class="icon" id="prev">◀</button><button class="play" id="toggle">${state.playing?'Ⅱ':'▶'}</button><button class="icon" id="next">▶</button></div><div class="progress"><span>${fmt(state.pos)}</span><input id="seek" type="range" min="0" max="1000" value="${Math.round(state.pos/state.duration*1000)}"><span>${fmt(state.duration)}</span></div></div><div class="vol">🔊 <input id="volume" type="range" min="0" max="100" value="${Math.round(state.volume*100)}"></div></div>`:`<div class="player"><div class="now"><div class="thumb" style="background:#e6e6eb"></div><div class="nowcopy"><strong>Nothing playing</strong><span>Choose a song to begin</span></div></div><div class="controls"><div class="transport"><button class="play" id="toggle">▶</button></div></div></div>`;
$('#app').innerHTML=nav+`<main class="main">${top}<div class="page">${content}</div></main><div class="player-wrap">${player}</div>`;
wire(all);}
function wire(all){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=()=>{state.tab='playlist:'+b.dataset.playlist;render()});$('#newpl')?.addEventListener('click',createPlaylist);$('#login')?.addEventListener('click',login);$('#loginTop')?.addEventListener('click',login);$('#logout')?.addEventListener('click',()=>{state.user=null;save();render()});$('#search')?.addEventListener('input',e=>{state.query=e.target.value;state.tab=e.target.value?'search':'home';render();$('#search')?.focus()});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playId(b.dataset.play));$('#toggle')?.addEventListener('click',toggle);$('#next')?.addEventListener('click',()=>step(1));$('#prev')?.addEventListener('click',()=>step(-1));$('#seek')?.addEventListener('input',e=>{state.pos=Number(e.target.value)/1000*state.duration});$('#volume')?.addEventListener('input',e=>state.volume=Number(e.target.value)/100);$('#uploadBtn')?.addEventListener('click',()=>{if(!state.user)return login();$('#file')?.click()});$('#file')?.addEventListener('change',upload);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeFromCurrent(b.dataset.remove))}
function createPlaylist(){if(!state.user)return login();const name=prompt('Playlist name','My Playlist');if(!name)return;state.playlists.unshift({id:crypto.randomUUID(),name,tracks:[]});save();toast('Playlist created');render()}
function removeFromCurrent(id){const p=state.playlists.find(x=>x.id===state.tab.split(':')[1]);if(!p)return;p.tracks=p.tracks.filter(x=>x!==id);save();render()}
function playId(id){const t=trackList().find(x=>x.id===id);if(!t)return;state.current=t;state.duration=t.duration||180;state.pos=0;state.playing=true;startTone(t);render()}
function startTone(t){clearInterval(state.timer);if(state.ctx)try{state.ctx.close()}catch{};const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();state.ctx=ctx;const notes=[220,277.18,329.63,440];let i=0;state.timer=setInterval(()=>{if(!state.playing)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=notes[i++%4]*(1+(t.title.length%3)*.01);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.2);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.25)},750)}
function toggle(){if(!state.current)return playId('d1');state.playing=!state.playing;if(state.playing)startTone(state.current);else clearInterval(state.timer);render()}
function step(dir){const a=trackList(),i=a.findIndex(x=>x.id===state.current?.id);playId(a[(i+dir+a.length)%a.length].id)}
function login(){const wrap=document.createElement('div');wrap.className='auth';wrap.innerHTML=`<div class="modal"><button class="icon close" id="cx">×</button><div class="brand" style="padding:0 0 12px"><span class="orb">L</span><span>Lumin</span></div><h2>Welcome back</h2><div class="muted">Create a local demo account or sign in.</div><form id="authf"><input id="n" placeholder="Name" required><input id="e" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password (6+ chars)" minlength="6" required><button class="primary">Continue</button></form></div>`;document.body.appendChild(wrap);$('#cx').onclick=()=>wrap.remove();$('#authf').onsubmit=e=>{e.preventDefault();state.user={name:$('#n').value,email:$('#e').value};save();wrap.remove();render();toast('Signed in')}}
function upload(e){const f=e.target.files?.[0];if(!f)return;const t={id:'u'+Date.now(),title:f.name.replace(/\.[^.]+$/,''),artist:state.user?.name||'Your Library',album:'Uploads',genre:'Uploaded',c:'#a33f76',duration:180,url:URL.createObjectURL(f)};state.uploads.unshift(t);toast('Added to your library');render()}
render();
</script>
</body>
</html>
