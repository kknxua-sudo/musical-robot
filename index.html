<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7fa"><title>Lumin Music</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7fa;color:#17171b}.app{min-height:100vh}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e5e5ea;background:#fff;position:sticky;top:0}.brand{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}.orb{width:34px;height:34px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center}.actions{display:flex;gap:8px}.btn{border:0;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.dark{background:#111;color:#fff}.pink{background:#eb4f88;color:#fff}.main{max-width:1180px;margin:0 auto;padding:36px 24px 120px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#999}.title{font-size:48px;line-height:1;margin:8px 0}.sub{color:#85858e}.hero{margin-top:30px;min-height:330px;border-radius:28px;padding:42px;display:flex;align-items:end;color:#fff;background:radial-gradient(circle at 78% 24%,#8b5cf6,#24113d 42%,#101014 100%);box-shadow:0 18px 45px #2c1a441a}.hero h1{font-size:58px;letter-spacing:-.06em;margin:8px 0}.hero p{color:#ddd;margin:0 0 22px}.section{margin-top:42px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e5ea;border-radius:18px;padding:12px}.cover{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:900}.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card b{margin-top:10px;font-size:14px}.card span{font-size:12px;color:#888}.player{position:fixed;left:16px;right:16px;bottom:16px;max-width:1050px;margin:auto;background:#fff;border:1px solid #dddde4;border-radius:18px;box-shadow:0 16px 40px #19141f20;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.now{display:flex;align-items:center;gap:10px;min-width:0}.mini{width:46px;height:46px;border-radius:10px;background:#32145f;color:#fff;display:grid;place-items:center;font-weight:800}.controls{display:flex;align-items:center;gap:8px}.round{width:36px;height:36px;border-radius:50%;border:0;background:#efeff2;cursor:pointer}.play{background:#111;color:#fff}.status{font-size:12px;color:#888} @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:40px}.main{padding:25px 15px 130px}.nav{padding:0 15px}.title{font-size:38px}.player{left:8px;right:8px;bottom:8px}.status{display:none}}</style></head><body><div class="app"><header class="nav"><div class="brand"><span class="orb">L</span>Lumin</div><div class="actions"><button class="btn" onclick="alert('Sign-in is available in the full server build.')">Account</button></div></header><main class="main"><div class="eyebrow">YOUR MUSIC</div><h1 class="title">Listen, beautifully.</h1><p class="sub">A calm, ad-free music space for music you own.</p><section class="hero"><div><div class="eyebrow" style="color:#ccc">FEATURED</div><h1>Velvet Horizon</h1><p>Lumin Sessions · Night Drive</p><button class="btn pink" id="heroPlay">▶ Play now</button></div></section><section class="section"><div class="eyebrow">DISCOVER</div><h2>Made for you</h2><div class="grid" id="grid"></div></section></main><div class="player"><div class="now"><div class="mini" id="mini">V</div><div><strong id="track">Velvet Horizon</strong><div class="status" id="state">Ready to play</div></div></div><div class="controls"><button class="round" onclick="prev()">‹</button><button class="round play" id="play">▶</button><button class="round" onclick="next()">›</button></div></div></div><script>const tracks=[['Velvet Horizon','Lumin Sessions','#32145f'],['Glass Gardens','The North Arcade','#0b6470'],['Afterglow','Maya Vale','#7a174e'],['Parallel Lines','House Meridian','#28357e'],['Open Window','Cedar & Gold','#874b08'],['Soft Focus','Ari Bloom','#23613b'],['Satellite','Polar Youth','#253987'],['Midnight Bloom','Dusk Avenue','#7f1231']];let i=0,playing=false;const grid=document.getElementById('grid');tracks.forEach((t,n)=>grid.insertAdjacentHTML('beforeend',`<article class="card" onclick="choose(${n})"><div class="cover" style="background:${t[2]}">${t[0][0]}</div><b>${t[0]}</b><span>${t[1]}</span></article>`));function choose(n){i=n;playing=true;sync();}function sync(){const t=tracks[i];document.getElementById('track').textContent=t[0];document.getElementById('mini').textContent=t[0][0];document.getElementById('mini').style.background=t[2];document.getElementById('play').textContent=playing?'❚❚':'▶';document.getElementById('state').textContent=playing?'Playing demo preview':'Paused';}function prev(){i=(i+tracks.length-1)%tracks.length;playing=true;sync()}function next(){i=(i+1)%tracks.length;playing=true;sync()}document.getElementById('play').onclick=()=>{playing=!playing;sync()};document.getElementById('heroPlay').onclick=()=>{i=0;playing=!playing;sync()};sync();</script></body></html>
